<html>
<head>
 <style>
  body{
    background-color: rgb(185, 168, 168);
  }
 </style> 
    <title>STUDENTS RANKS BASED ON MARKS </title>
</head>
<body>
  <center>
     <h1 style="color:rgb(91, 22, 164);">STUDENTS RANK LIST </h1>   
  </center>  
  <center>
  <span style="font-size:20px;">Name:</span><input id="name" style="padding: 10px;border-radius: 5px;border: none"type="text" placeholder="Enter Name">
  <span style="font-size:20px;">Math:</span><input id="math" style="padding: 10px;border-radius: 5px;border: none"type="text" placeholder="Enter Marks">
 <span style="font-size:20px;">Science:</span><input id="science" style="padding: 10px;border-radius: 5px;border: none"type="text" placeholder="Enter Marks">
  <span style="font-size:20px;">English:</span> <input id="english" style="padding: 10px;border-radius: 5px;border: none"type="text" placeholder="Enter Marks">
 <br><br>

  <button style="background-color: crimson; color:white;cursor: pointer;padding: 10px;border-radius: 5px;border: none;margin-right: 10px;" onclick="add()">Add Students</button>
  <button style="background-color: crimson; color:white;cursor:pointer;padding: 10px;border-radius: 5px;border: none;" onclick="calculate()">Calculate Rank</button>
  </center>
  <br><br><br>
  <center>
  <table  style="border:2px solid whitesmoke;width: 300px;" border="1">
    <tr style="background-color: aquamarine;">
        <th >Name</th>
        <th>Total</th>
        <th>Percentage</th>
        <th>Rank</th>
    </tr>
    <tbody id="out"></tbody>
  </table>
  </center>
  <script>
    let students=[];
    function add(){
     let n=document.getElementById("name").value;
     let m=+document.getElementById("math").value;
     let s=+document.getElementById("science").value;
     let e=+document.getElementById("english").value;
    
     let t=m+s+e;
     let p=t/3;
     
     students.push({name:n,total:t,per:p});
     show();
    }
    function calculate(){
        students.sort((a,b)=>b.per-a.per);
        students.forEach((x,i)=>x.rank=i+1);
        show();
    }
    function show(){
     let rows="";
     students.forEach(x=>{
        rows+="<tr><td>"+x.name+"</td><td>"+x.total+"</td><td>"+x.per.toFixed(1)+"</td><td>"+(x.rank||"")+"</td></tr>"   
     });
      document.getElementById("out").innerHTML=rows;
    }
</script>
</body>
</html>
